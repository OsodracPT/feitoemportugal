# Origin for feitoemportugal.org. Plain HTTP on purpose: Traefik (behind the
# Pangolin resource) terminates TLS and owns the certificates, so this server
# only serves files and sets the headers Pangolin-managed routers cannot.
#
# Loaded into nginx's http{} block as /etc/nginx/conf.d/default.conf.

# Each 404 answers in the visitor's language. Note the two shapes: Astro writes
# the root 404 as a file and the English one as a directory.
map $uri $fep_not_found {
    ~^/en(/|$)  /en/404/index.html;
    default     /404.html;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml
           application/xml text/xml text/plain;

# Traefik reaches us from gerbil's address on nostr-net.
set_real_ip_from 172.22.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server_tokens off;

server {
    listen 80;
    server_name www.feitoemportugal.org;
    access_log off;
    return 308 https://feitoemportugal.org$request_uri;
}

server {
    # default_server so a probe by IP (status.py, health checks) gets the site.
    listen 80 default_server;
    server_name feitoemportugal.org _;

    # `current` is a symlink swapped atomically on every deploy; nginx resolves
    # it per request, so a release goes live without a reload.
    root /srv/www/current;
    index index.html;

    # Traefik already logs every request; a second log of visitor IPs here
    # would only be more personal data to look after.
    access_log off;

    # Relative Location headers: we sit behind a proxy and never know the
    # public scheme for sure.
    absolute_redirect off;

    error_page 404 $fep_not_found;

    # Release bookkeeping (.assets manifest) is not for the public.
    location ~ /\. {
        return 404;
    }

    # trailingSlash: 'never' — every page has exactly one URL, without the
    # slash, which is what the canonicals and the sitemap say.
    location ~ ^(?<fep_noslash>.+)/$ {
        return 301 $fep_noslash$is_args$args;
    }

    # Hashed file names: safe to cache forever.
    location ^~ /_assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # The public JSON API is open data: any origin may read it.
    location ^~ /api/v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Phase 5: the submission form's backend.
    # location /api/submit {
    #     proxy_pass http://submit-api:3000;
    # }

    # Pages, /search-index.json and the rest: revalidate every time (the ETag
    # makes that a 304 when nothing changed), so a deploy is seen at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # /marcas is served from /marcas/index.html with no redirect.
        try_files $uri $uri/index.html =404;
    }
}
