# Reference web server config for the static build (site/dist).
#
# Plain HTTP on purpose: put any TLS terminator in front (a reverse proxy, a
# load balancer, a CDN), or add a `listen 443 ssl` block here if nginx faces the
# internet itself. The headers below assume visitors arrive over HTTPS.
#
# Domain-agnostic: it serves whatever host it is asked for, and redirects any
# www.<domain> to <domain>.
#
# Loaded into nginx's http{} block, e.g. as /etc/nginx/conf.d/default.conf.
# Expects the build at /srv/www/current (see docker-compose.yml).

# Each 404 answers in the visitor's language. Note the two shapes: Astro writes
# the root 404 as a file and the English one as a directory.
map $uri $fep_not_found {
    ~^/en(/|$)  /en/404/index.html;
    default     /404.html;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml
           application/xml text/xml text/plain;

server_tokens off;

# Client-IP trust. The rate limits below key on the client address. When nginx
# sits behind a reverse proxy (a CDN, a load balancer, Pangolin…), the
# connection address is the PROXY's, so without real_ip every visitor shares one
# bucket and a single burst locks out everyone. That proxy address is
# site-specific, so it lives in a snippet: the tracked real-ip.conf is a safe
# no-op (trust nobody, direct-facing deploy); a deploy behind a proxy overrides
# the mount with its own. See real-ip.conf and README.md.
include /etc/nginx/snippets/real-ip.conf;

# Rate limiting, defense in depth: the submit service already caps submissions
# per IP in the app, but a flood still reaches it to be rejected; these stop the
# flood at the edge. `fep_submit` guards the runtime service, `fep_api` the
# (static, cheap) open data. A rejected request gets 429, not nginx's default
# 503, so a client can tell it is throttled.
limit_req_zone  $binary_remote_addr zone=fep_submit:10m rate=1r/s;
limit_req_zone  $binary_remote_addr zone=fep_api:10m    rate=30r/s;
limit_conn_zone $binary_remote_addr zone=fep_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name ~^www\.(?<fep_apex>.+)$;
    access_log off;
    return 308 https://$fep_apex$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    # `current` may be a symlink swapped atomically on each deploy; nginx
    # resolves it per request, so a release goes live without a reload.
    root /srv/www/current;
    index index.html;

    # The site promises no tracking; not logging visitor IPs here is part of
    # that. Turn it on for debugging if you need it.
    access_log off;

    # Relative Location headers: behind a proxy, nginx cannot know the public
    # scheme and port for sure.
    absolute_redirect off;

    error_page 404 $fep_not_found;

    # Dotfiles (such as the deploy gate's .assets manifest) are not for the public.
    location ~ /\. {
        return 404;
    }

    # trailingSlash: 'never' — every page has exactly one URL, without the
    # slash, which is what the canonicals and the sitemap say.
    location ~ ^(?<fep_noslash>.+)/$ {
        return 301 $fep_noslash$is_args$args;
    }

    # Hashed file names: safe to cache forever.
    location ^~ /_assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # The public JSON API is open data: any origin may read it. Static files, so
    # the limit is generous: it only clips a runaway scraper, not normal use.
    location ^~ /api/v1/ {
        limit_req  zone=fep_api burst=60 nodelay;
        limit_conn fep_conn 20;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # The submission service (contribution forms). Same origin on purpose: the
    # forms post here under the CSP's `form-action 'self'` / `connect-src 'self'`
    # with no exception. Optional — only reached when the `submit` Compose
    # service is up (see docker-compose.yml). The variable upstream plus Docker's
    # embedded resolver means nginx still starts when the service is absent; the
    # location simply answers 502 until it is up. Outside Docker, point the
    # proxy_pass at wherever the service listens and drop the resolver.
    location ^~ /api/submit/ {
        # A legit submission is a couple of requests (the Altcha challenge, then
        # the POST); the burst covers that while a flood is dropped before it
        # reaches Node. The app's per-IP limit still handles sustained abuse.
        limit_req  zone=fep_submit burst=10 nodelay;
        limit_conn fep_conn 20;
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=30s;
        set $fep_submit submit:8787;
        proxy_pass http://$fep_submit;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages, /search-index.json and the rest: revalidate every time (the ETag
    # makes that a 304 when nothing changed), so a deploy is seen at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # /marcas is served from /marcas/index.html with no redirect.
        try_files $uri $uri/index.html =404;
    }
}
