# Client-IP trust for the rate limits in nginx.conf. Included at the http level.
#
# This tracked copy is a deliberate NO-OP: it trusts no proxy, so nginx keys the
# rate limits on the real connection address. That is correct when nginx faces
# the internet directly.
#
# Behind a reverse proxy (a CDN, a load balancer, a tunnel…) the connection
# address is the proxy's, the same for every visitor, so one bucket is shared
# and a single burst locks everyone out. Fix it by trusting the proxy and
# reading the real client from X-Forwarded-For:
#
#     set_real_ip_from  <proxy address or subnet>;   # e.g. 10.0.0.0/8
#     real_ip_header    X-Forwarded-For;
#     real_ip_recursive on;
#
# Trust ONLY your proxy. If nginx is also reachable directly, a client could
# forge X-Forwarded-For to dodge the limit, so never trust 0.0.0.0/0.
#
# The proxy address is site-specific and must stay out of the repository
# (host-agnostic). Do not edit this file in place — it is mounted read-only.
# Instead, keep your real settings in an untracked file and point the mount at
# it from docker-compose.override.yml, for example:
#
#     services:
#       web:
#         volumes:
#           - ./real-ip.local.conf:/etc/nginx/snippets/real-ip.conf:ro
#
# (real-ip.local.conf is gitignored; see README.md.)
