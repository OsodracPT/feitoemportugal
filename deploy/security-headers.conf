# Included in every location: nginx drops inherited add_header directives as
# soon as a location declares one of its own, so these cannot live at server
# level next to the per-location Cache-Control.
#
# script-src 'self' holds because the build emits no inline executable script
# (JSON-LD is data, not script). style-src needs 'unsafe-inline' for the
# <style> blocks Astro inlines into each page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
