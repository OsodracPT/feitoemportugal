# Runs on every pull request: data, types, tests and a full build.
# The blog checks (PT/EN pairs, BrandCard references) join this workflow with
# the blog itself, in phase 3.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and giving it both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The scripts run TypeScript directly, which needs Node 22.18 or newer.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Brand schema, taxonomy references, duplicate slugs, municipality in district.
      - name: Validate data
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Catches anything the checks above cannot see, such as a broken route.
      - name: Build
        run: pnpm build

      # A draft merges without error and then never appears on the site, which is
      # easy to miss on a suggestion PR. Warn, do not fail: holding a brand back
      # as a draft is sometimes the point. Only brands this PR adds: the drafts
      # already on main are known, and a PR that edits them should stay quiet.
      # Comparing the two trees needs no history, so the shallow checkout is enough.
      - name: Flag brands that stay drafts
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- 'data/brands/*.yaml' | while read -r file; do
            line=$(grep -n '^status: draft' "$file" | cut -d: -f1)
            if [ -n "$line" ]; then
              echo "::warning file=$file,line=$line::$(basename "$file" .yaml) is still a draft: merging keeps it off the site. Set status: published when it is ready."
            fi
          done
