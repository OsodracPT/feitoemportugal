- id: aveiro
  type: distrito
  label: { pt: Aveiro, en: Aveiro }
  slug: { pt: aveiro, en: aveiro }
  intro:
    pt: >-
      Entre a ria e a serra, o distrito de Aveiro concentra o maior cluster de
      calçado do país, em São João da Madeira e arredores, além da porcelana de
      Ílhavo e de uma forte indústria de metalomecânica e cerâmica.
    en: >-
      Between the lagoon and the hills, the Aveiro district holds Portugal's largest
      footwear cluster around São João da Madeira, alongside the porcelain works of
