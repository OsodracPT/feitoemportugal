# 18 distritos + 2 regiões autónomas, com os respetivos concelhos (308 no total).
#
# Os `centroid` dos concelhos são calculados a partir da CAOP 2025 (DGT, CC BY 4.0)
# por `node scripts/import-caop.ts`; não os edites à mão. O mapa coloca cada
# marca no centroide do seu concelho, nunca numa morada.
# O `centroid` de cada distrito é o da sua sede e serve para centrar o mapa.
# Formato: [latitude, longitude].

- id: aveiro
  type: distrito
  label: { pt: Aveiro, en: Aveiro }
  slug: { pt: aveiro, en: aveiro }
  intro:
    pt: >-
      O distrito de Aveiro tem o maior polo de calçado do país, em São João da Madeira e
      arredores, a porcelana de Ílhavo e muita indústria metalomecânica e cerâmica.
    en: >-
      The Aveiro district has Portugal's largest footwear cluster, around São João da
