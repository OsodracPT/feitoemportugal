- id: ceramica-e-vidro
  label: { pt: Cerâmica e vidro, en: Ceramics and glass }
  slug: { pt: ceramica-e-vidro, en: ceramics-and-glass }
  intro:
    pt: >-
      Louça, porcelana, faiança, azulejo e vidro produzidos em Portugal. Caldas da
      Rainha, Alcobaça, Ílhavo e a Marinha Grande mantêm fábricas e olarias com mais
      de um século.
    en: >-
      Tableware, porcelain, faience, tiles and glass made in Portugal. Caldas da
      Rainha, Alcobaça, Ílhavo and Marinha Grande still host factories and potteries
      over a century old.
  faq:
    - question:
        pt: Qual é a diferença entre faiança e porcelana?
        en: What is the difference between faience and porcelain?
      answer:
        pt: >-
          A faiança cozida a temperatura mais baixa é mais porosa e espessa, e é a
          base da louça pintada à mão das Caldas e de Alcobaça. A porcelana é cozida
          a temperaturas altas, fica translúcida e é mais resistente.
        en: >-
          Faience is fired at lower temperatures, which makes it thicker and more
          porous. It is the base of the hand-painted ware from Caldas and Alcobaça.
          Porcelain is fired hotter, turning translucent and more durable.
  price_levels:
    - level: 1
      label: { pt: "até 20 €", en: "under €20" }
    - level: 2
      label: { pt: "20 € a 60 €", en: "€20 to €60" }
    - level: 3
      label: { pt: "60 € a 150 €", en: "€60 to €150" }
    - level: 4
      label: { pt: "acima de 150 €", en: "over €150" }
  subcategories:
    - id: louca-de-mesa
      label: { pt: Louça de mesa, en: Tableware }
      slug: { pt: louca-de-mesa, en: tableware }
    - id: porcelana
      label: { pt: Porcelana, en: Porcelain }
      slug: { pt: porcelana, en: porcelain }
    - id: faianca
