      Soaps, creams, perfumes and personal care products manufactured in Portugal. The
      Porto region has had soap works running since the 19th century, with packaging
      many people recognise at a glance.
  faq:
    - question:
        pt: Os ingredientes também são portugueses?
        en: Are the ingredients Portuguese too?
      answer:
        pt: >-
          Nem sempre. Muitas fórmulas usam óleos e ativos importados, mas a produção,
          o enchimento e a embalagem são feitos em Portugal. Quando o âmbito é parcial,
          a ficha da marca explica o que é feito no país.
        en: >-
          Not always. Many formulas use imported oils and actives, while manufacturing,
          filling and packaging happen in Portugal. When the scope is partial, the
          brand page explains what is actually made here.
  price_levels:
    - level: 1
