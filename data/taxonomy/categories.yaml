# Categorias e subcategorias do Feito em Portugal.
# Lista fixa: só muda por PR revisto.
# `price_levels` define a referência de cada nível (1-4) dentro da categoria,
# para a classificação ser consistente entre marcas.

- id: moda-e-vestuario
  label: { pt: Moda e vestuário, en: Fashion and clothing }
  slug: { pt: moda-e-vestuario, en: fashion-and-clothing }
  intro:
    pt: >-
      Marcas portuguesas de roupa que produzem no país, da malha do Vale do Ave
      à confeção de alfaiataria. Inclui coleções próprias e projetos de autor que
      trabalham com oficinas nacionais.
    en: >-
      Portuguese clothing brands that manufacture in the country, from knitwear in
      the Ave valley to tailoring workshops. Includes own-label collections and
      designer projects produced with local factories.
  faq:
    - question:
        pt: Porque é que tanta roupa é feita em Portugal?
        en: Why is so much clothing made in Portugal?
      answer:
        pt: >-
          O norte do país concentra fiação, malhas, tinturarias e confeção a poucos
          quilómetros de distância, o que permite séries pequenas e prazos curtos.
          Muitas marcas internacionais produzem aqui pela mesma razão.
        en: >-
          Northern Portugal has spinning, knitting, dyeing and sewing within a few
          kilometres of each other, which makes small runs and short lead times
          possible. Many international labels produce here for the same reason.
  price_levels:
    - level: 1
      label: { pt: "peças até 30 €", en: "items under €30" }
    - level: 2
      label: { pt: "30 € a 80 €", en: "€30 to €80" }
    - level: 3
      label: { pt: "80 € a 200 €", en: "€80 to €200" }
    - level: 4
      label: { pt: "acima de 200 €", en: "over €200" }
  subcategories:
    - id: roupa-mulher
      label: { pt: Roupa de mulher, en: Womenswear }
      slug: { pt: roupa-mulher, en: womenswear }
    - id: roupa-homem
      label: { pt: Roupa de homem, en: Menswear }
      slug: { pt: roupa-homem, en: menswear }
    - id: malhas
      label: { pt: Malhas, en: Knitwear }
      slug: { pt: malhas, en: knitwear }
    - id: denim
      label: { pt: Denim, en: Denim }
      slug: { pt: denim, en: denim }
    - id: roupa-interior-e-meias
      label: { pt: Roupa interior e meias, en: Underwear and socks }
      slug: { pt: roupa-interior-e-meias, en: underwear-and-socks }
    - id: banho
      label: { pt: Moda de banho, en: Swimwear }
      slug: { pt: moda-de-banho, en: swimwear }
    - id: trabalho-e-uniformes
      label: { pt: Vestuário de trabalho, en: Workwear }
      slug: { pt: vestuario-de-trabalho, en: workwear }

- id: calcado
  label: { pt: Calçado, en: Footwear }
  slug: { pt: calcado, en: footwear }
  intro:
    pt: >-
      O calçado é a indústria portuguesa mais conhecida fora do país. Em São João
      da Madeira, Felgueiras e Guimarães há fábricas que fazem sapatos de pele
      cosidos à mão para marcas próprias e para o resto do mundo.
    en: >-
      Footwear is Portugal's best-known export industry. Around São João da Madeira,
      Felgueiras and Guimarães, factories hand-stitch leather shoes for their own
      labels and for brands worldwide.
  faq:
    - question:
        pt: O que distingue o calçado feito em Portugal?
        en: What sets Portuguese-made footwear apart?
      answer:
        pt: >-
          A combinação de curtumes, componentes e fábricas na mesma região permite
          construções tradicionais, como a sola cosida, em séries pequenas, com
          controlo de qualidade próximo e salários europeus.
        en: >-
          Tanneries, component makers and factories sit in the same region, which
          allows traditional constructions such as stitched soles in small runs,
          with close quality control and European labour standards.
    - question:
        pt: Como sei que um sapato foi mesmo feito em Portugal?
        en: How do I know a shoe was really made in Portugal?
      answer:
        pt: >-
          Procura a indicação de origem na palmilha ou na caixa e, na dúvida,
          pergunta à marca onde fica a fábrica. As marcas listadas aqui declaram a
          origem, e o selo «verificado» indica que confirmámos essa informação.
        en: >-
          Look for the origin marking on the insole or box and, if in doubt, ask the
          brand where its factory is. Brands listed here declare their origin, and the
          "verified" badge means we confirmed it.
  price_levels:
    - level: 1
      label: { pt: "até 50 €", en: "under €50" }
    - level: 2
      label: { pt: "50 € a 120 €", en: "€50 to €120" }
    - level: 3
      label: { pt: "120 € a 250 €", en: "€120 to €250" }
    - level: 4
      label: { pt: "acima de 250 €", en: "over €250" }
  subcategories:
    - id: sapatos-homem
      label: { pt: Sapatos de homem, en: Men's shoes }
      slug: { pt: sapatos-homem, en: mens-shoes }
    - id: sapatos-mulher
      label: { pt: Sapatos de mulher, en: Women's shoes }
      slug: { pt: sapatos-mulher, en: womens-shoes }
    - id: sapatilhas
      label: { pt: Sapatilhas, en: Sneakers }
      slug: { pt: sapatilhas, en: sneakers }
    - id: botas
      label: { pt: Botas, en: Boots }
      slug: { pt: botas, en: boots }
    - id: sandalias-e-chinelos
      label: { pt: Sandálias e chinelos, en: Sandals and slippers }
      slug: { pt: sandalias-e-chinelos, en: sandals-and-slippers }
    - id: calcado-crianca
      label: { pt: Calçado de criança, en: Kids' footwear }
      slug: { pt: calcado-crianca, en: kids-footwear }

