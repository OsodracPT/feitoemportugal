# Vocabulário controlado de tipos de produto.
# Cada tipo pertence a uma categoria (que só serve para os agrupar na página
# de produtos); uma marca pode ter vários tipos, de categorias diferentes.
# `synonyms` alimenta a pesquisa (MiniSearch) e não é mostrado na interface.
# Só entra um tipo que pelo menos uma marca (publicada ou em rascunho) produza.
# `price_bands`: quanto custa um artigo de referência (`item`) em cada nível de
# preço; `max` são os limites superiores dos níveis 1, 2 e 3 em euros, e o nível 4
# fica acima. Seguem o mercado em geral, não este catálogo: €€ é um preço de
# loja de rua, €€€€ um preço de luxo. Revêem-se uma vez por ano.

